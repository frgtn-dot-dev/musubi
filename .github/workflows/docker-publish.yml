name: Publish Docker images

# Manual release. API and web are built under the same immutable version first.
# The Git tag is created only after both manifests exist and is the sole Dokploy
# deployment signal. Mutable latest/minor aliases are not published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 0.1.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::Releases must run from main"
            exit 1
          }
          V="$RELEASE_VERSION"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must be X.Y.Z (no leading v)"
            exit 1
          }
          node scripts/verify-release.mjs "$V"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" \
            >/dev/null 2>&1; then
            echo "::error::v$V already exists and cannot be overwritten"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frgtndev/musubi
            dockerfile: apps/api/Dockerfile
            scope: api
          - image: frgtndev/musubi-web
            dockerfile: apps/web/Dockerfile
            scope: web
    steps:
      - uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: >-
          docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: >-
          docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: >-
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Musubi v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
