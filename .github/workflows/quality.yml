name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, lint, docs, and migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Verify generated migrations are committed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musubi
          ENVIRONMENT: test
          BETTER_AUTH_URL: http://localhost:7531
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --short -- packages/db/drizzle
            echo "::error::Database schema and committed Drizzle migrations differ"
            exit 1
          fi

  e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Its own job, not part of `pnpm check`: the browser download and the dev
      # server are the slow part, and keeping them off the critical path means
      # typecheck/lint still report in under a minute.
      - name: Install Playwright browser
        run: pnpm --filter @musubi/web exec playwright install --with-deps chromium

      - run: pnpm --filter @musubi/web test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  bundle:
    name: Client bundle secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the client with a canary in every server-only variable and fails if
      # any of them reaches a file the browser can fetch. Its own job because it
      # needs a production build, which `pnpm check` deliberately does not do.
      - run: node scripts/scan-client-bundle.mjs

  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: apps/api/Dockerfile
            scope: api
          - name: web
            dockerfile: apps/web/Dockerfile
            scope: web
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Per-image cache scope: sharing one scope would make the two matrix jobs
      # overwrite each other's layers on every run.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
