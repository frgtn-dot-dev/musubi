name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, lint, docs, and migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Verify generated migrations are committed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musubi
          ENVIRONMENT: test
          BETTER_AUTH_URL: http://localhost:7531
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --short -- packages/db/drizzle
            echo "::error::Database schema and committed Drizzle migrations differ"
            exit 1
          fi

  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: apps/api/Dockerfile
            scope: api
          - name: web
            dockerfile: apps/web/Dockerfile
            scope: web
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Per-image cache scope: sharing one scope would make the two matrix jobs
      # overwrite each other's layers on every run.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
