name: Chromatic

on:
  pull_request:
    paths:
      - ".github/workflows/chromatic.yml"
      - "apps/web/**"
      - "packages/calendar/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chromatic.yml"
      - "apps/web/**"
      - "packages/calendar/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  visual:
    name: Storybook visual regression
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Report missing project token
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: >-
          echo "::notice::Chromatic disabled: project token is not configured."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: env.CHROMATIC_PROJECT_TOKEN != ''

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Publish and test Storybook
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@aeb03996bc5edda8cb56ac3cf4f5f294b4846baf # v18
        with:
          buildScriptName: storybook:build
          externals: |
            ../../packages/calendar/**
            ../../packages/types/**
          onlyChanged: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
