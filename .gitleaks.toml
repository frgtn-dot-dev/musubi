paths = [
  '''(?:^|[/\\])\.env$''',
  '''(?:^|[/\\])apps[/\\]client[/\\]\.expo[/\\]''',
  '''(?:^|[/\\])apps[/\\]client[/\\]dist[/\\]''',
  '''(?:^|[/\\])apps[/\\]client[/\\]google-services\.json$''',
  '''(?:^|[/\\])apps[/\\]web[/\\]storybook-static[/\\]''',
  '''(?:^|[/\\])packages[/\\]docs[/\\]dist[/\\]''',
]
