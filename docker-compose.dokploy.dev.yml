# Musubi — a Dokploy dev deployment built from the selected branch.
#
# Traefik exposes only Caddy. Caddy uses the same checked-in routing contract as
# production and the default Compose stack, so /api/* cannot fall through to the
# TanStack web server. Never point this file at production data or secrets.
#
# Required environment:
#   PUBLIC_HOST=dev.musubi.pro
#   BETTER_AUTH_URL=https://dev.musubi.pro
#   BETTER_AUTH_SECRET=...              (dev-only secret)
#   POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
#   ENVIRONMENT=dev
services:
  gateway:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: :80
    volumes:
      - ./ops/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - dev-caddy-data:/data
      - dev-caddy-config:/config
    depends_on:
      - api
      - web
    expose:
      - "80"
    networks:
      dokploy-network: {}
      default: {}
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.musubi-dev-gateway.loadbalancer.server.port: "80"
      traefik.http.routers.musubi-dev-gateway.rule: >-
        Host(`${PUBLIC_HOST:?Set PUBLIC_HOST to your dev hostname}`)
      traefik.http.routers.musubi-dev-gateway.entrypoints: websecure
      traefik.http.routers.musubi-dev-gateway.tls.certresolver: >-
        ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.middlewares.musubi-dev-https.redirectscheme.scheme: https
      traefik.http.middlewares.musubi-dev-https.redirectscheme.permanent: "true"
      traefik.http.routers.musubi-dev-http.rule: Host(`${PUBLIC_HOST}`)
      traefik.http.routers.musubi-dev-http.entrypoints: web
      traefik.http.routers.musubi-dev-http.middlewares: musubi-dev-https
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${API_SERVER_PORT:-7531}"
    deploy:
      replicas: 1
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set your password inside .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dev-data:
  dev-caddy-data:
  dev-caddy-config:

networks:
  dokploy-network:
    external: true
