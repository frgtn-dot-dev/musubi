# Musubi — a Dokploy dev deployment built from the selected branch.
#
# Add one Dokploy Domain in the UI: service `gateway`, container port 80. Caddy
# uses the same checked-in routing contract as production and the default stack,
# so /api/* cannot fall through to TanStack. Never expose web or api.
#
# Required environment:
#   BETTER_AUTH_URL=https://dev.musubi.pro
#   BETTER_AUTH_SECRET=...              (dev-only secret)
#   POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
#   ENVIRONMENT=dev
services:
  gateway:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: :80
      API_UPSTREAM: musubi-api-internal:7531
      WEB_UPSTREAM: musubi-web-internal:3000
      # Development has no separate marketing site; `/` reaches the app and
      # its index route redirects to the default calendar under `/app`.
      MARKETING_UPSTREAM: musubi-web-internal:3000
    volumes:
      - ./ops/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - dev-caddy-data:/data
      - dev-caddy-config:/config
    depends_on:
      - api
      - web
    expose:
      - "80"
    networks:
      dokploy-network: {}
      default: {}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3000
    expose:
      - "3000"
    networks:
      default:
        aliases:
          - musubi-web-internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    networks:
      default:
        aliases:
          - musubi-api-internal
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Used only when S3_BUCKET is unset.
      MEDIA_DIR: /app/data/media
    volumes:
      - dev-media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${API_SERVER_PORT:-7531}"
    deploy:
      replicas: 1
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set your password inside .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dev-data:
  dev-media:
  dev-caddy-data:
  dev-caddy-config:

networks:
  dokploy-network:
    external: true
