# Example for the repository's Compose service named `api` on a shared,
# private Docker network. Change the target for other deployment topologies.
# Configure retention on the Prometheus process, e.g. --storage.tsdb.retention.time=90d.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/musubi-alerts.yml
scrape_configs:
  - job_name: musubi-api
    scrape_timeout: 10s
    static_configs:
      - targets: ["api:9464"]
# Alert rules are evaluated here; configure your existing Alertmanager under
# `alerting` to deliver notifications. No notification receiver is implied.
