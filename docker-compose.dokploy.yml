# Musubi — the full production stack on Dokploy.
#
# Expose one Dokploy Domain in the UI: service `gateway`, container port 80.
# Caddy owns the stable /api/* versus web split from ops/gateway/Caddyfile,
# exactly as in the default docker-compose.yml. Never expose web or api.
#
# Required environment:
#   BETTER_AUTH_URL=https://musubi.example.com
#   BETTER_AUTH_SECRET=...              (openssl rand -base64 32)
#   POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
#
# Upgrade: bump MUSUBI_TAG and redeploy. Safe rollback also requires restoring
# the matching pre-upgrade database backup because migrations are forward-only.
services:
  gateway:
    image: caddy:2-alpine
    environment:
      # TLS terminates at Traefik; Caddy serves plain HTTP inside Docker.
      PUBLIC_HOST: :80
      API_UPSTREAM: musubi-api-internal:7531
      WEB_UPSTREAM: musubi-web-internal:3000
      # A marketing site on `/`, reached across dokploy-network by its service
      # name (host:port). Unset leaves the apex with the web client.
      MARKETING_UPSTREAM: ${MARKETING_UPSTREAM:-musubi-web-internal:3000}
    volumes:
      - ./ops/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    expose:
      - "80"
    networks:
      dokploy-network: {}
      default: {}
    restart: unless-stopped

  web:
    image: frgtndev/musubi-web:${MUSUBI_TAG:-latest}
    environment:
      PORT: 3000
    expose:
      - "3000"
    networks:
      default:
        aliases:
          - musubi-web-internal
    restart: unless-stopped

  api:
    image: frgtndev/musubi:${MUSUBI_TAG:-latest}
    env_file:
      - .env
    networks:
      default:
        aliases:
          - musubi-api-internal
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${API_SERVER_PORT:-7531}"
    deploy:
      replicas: 1
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set your password inside .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  caddy-data:
  caddy-config:

networks:
  dokploy-network:
    external: true
